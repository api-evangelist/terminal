name: Terminal
description: >-
  Terminal (terminal.io) is a talent platform for hiring vetted remote and nearshore
  software engineers for full-time, contract, and contract-to-hire roles. It combines
  AI-fluency assessment and technical vetting (accepting roughly the top 7% of applicants)
  with Employer of Record (EOR) services that handle HR, payroll, and benefits across
  180+ countries, sourcing engineers from Latin America, Canada, and Europe. Terminal
  is a B2B staffing and hiring platform rather than an API provider — it publishes no
  public developer API, SDK, or developer portal. Backed by 8VC and Lightspeed Venture
  Partners; added to the API Evangelist network as a company profile.
